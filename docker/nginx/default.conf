# Configuración de Nginx: recibe las peticiones HTTP del navegador
# y las reenvía al contenedor de PHP-FPM (ver fastcgi_pass más abajo).
server {
    listen 80;
    server_name localhost;

    # Laravel expone todo desde public/ — nunca apuntes el root a la raíz del proyecto,
    # o expondrías .env, código fuente, etc.
    root /var/www/html/public;

    index index.php index.html;

    # Log dentro del contenedor (se puede montar como volumen si quieres verlos desde el host)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Cualquier ruta que no sea un archivo real se enruta a index.php,
    # que es el "front controller" de Laravel (todo pasa por ahí).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Los archivos .php se delegan al contenedor "app" (PHP-FPM) por el puerto 9000.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea el acceso directo a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
